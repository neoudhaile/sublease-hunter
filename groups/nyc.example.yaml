# NYC Facebook housing groups: the master list of groups we READ (scrape for
# people seeking a sublet) and POST in (list the user's room).
#
# RULES FOR EVERY AGENT (see also CLAUDE.md):
#   - Work only within this list. Never read from or post in a group that is
#     not here. To use a new group, ADD it here first (with evidence), then use it.
#   - Never delete an entry. If a group stops working, set status: retired and
#     say why in notes, so nobody re-tries it blind.
#   - Update membership / post / last_verified whenever you observe a change
#     (membership approved, post rejected, admin queue cleared, price demanded).
#   - Per-period posting state (which listing is live where, permalinks) lives in
#     the Notion "Posts" database, not here. This file holds durable facts only.
#
# FIELDS
#   id            the part of the URL after facebook.com/groups/ (slug or number)
#   members       approximate member count when last seen (null = unknown)
#   visibility    public | private | null
#   membership    member | pending | not-joined | null(unknown)
#   read          true = include in seeker scrapes (forage needs membership for
#                 private groups)
#   post          ok | admin-queue | blocked | not-joined | untested
#                   ok          posts go live immediately
#                   admin-queue posts wait for admin approval
#                   blocked     can't post yet (membership / questionnaire pending)
#                   not-joined  join first (see notes)
#                   untested    member, never tried posting
#   requires_price  true | false | unknown. If true, the listing MUST include a
#                 price: use listing.nightly_rate from config.yaml. Otherwise
#                 NEVER put a price in the listing.
#   short_term    true if the group is specifically for short-term sublets
#   status        active | retired
#   last_verified date the membership/post facts were last observed
#
# This example ships 32 real NYC groups with all PERSONAL state reset:
# membership, read and post are yours to fill in as you join and post. Member
# counts, visibility and group quirks are kept because they are facts about the
# group, not about you. Copy it to groups/<city>.yaml and edit.

